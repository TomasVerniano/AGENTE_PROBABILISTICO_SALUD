<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Virtual - Centro Médico</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
    <style>
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background-color: #868788; border-radius: 4px; }
        .chat-container::-webkit-scrollbar-track { background-color: transparent; }

        .imagen1{
            background-image: url('{{ url_for('static', filename='fondo_input.png') }}');
            background-size: cover;          
            background-position: center;
            background-repeat: no-repeat;
        }

        .imagen{
            background-image: url('{{ url_for('static', filename='fondo_chat2.1.png') }}');
            background-size: cover;          
            background-position: center;
            background-repeat: no-repeat;
        }

    </style>
</head>
<body class="text-slate-800 font-sans h-screen w-screen flex flex-col overflow-hidden">

    <header class="bg-slate-600 border-b border-slate-700 p-4 text-white flex items-center justify-between shadow-sm z-10 px-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-slate-700/50 border border-slate-600 rounded-xl flex items-center justify-center text-xl shadow-inner bg-transparent">
                <img src="{{ url_for('static', filename='logo.png') }}" class="w-full h-full object-contain bg-transparent">
            </div>
            <div>
                <h1 class="font-semibold text-2xl tracking-wide text-slate-100">Asistente Virtual</h1>
            </div>
        </div>
        <button id="btn-reiniciar" onclick="reiniciarChat()" class="bg-slate-700 hover:bg-slate-600  hover:text-white text-2xl px-4 py-2 rounded-lg font-medium transition-all border border-slate-600 shadow-sm cursor-pointer">
            Volver
        </button>
    </header>

    <main id="main" class="bg-zinc-300 flex-1 flex flex-col overflow-hidden imagen1">
        
        <div id="form-section" class="flex-1 overflow-y-auto p-1 flex items-center justify-center bg-transparent">
            <div class="min-w-200 max-w-full shadow-sm border border-slate-200/80 rounded-xl p-1 space-y-10 text-2xl bg-white/[0.55]">
                <div class="border-b border-slate-100 pb-3">
                    <h2 class="text-2xl font-semibold text-slate-800 text-center">Datos del usuario</h2>
                    <p class="text-2xl text-slate-800 text-center">Por favor, complete el formulario.</p>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-800 uppercase tracking-wider mb-1">DNI</label>
                        <input type="text" id="dni" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-slate-400 focus:bg-white text-2xl transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-800 uppercase tracking-wider mb-1">Sexo</label>
                        <select id="sexo" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-slate-400 focus:bg-white text-2xl transition-all">
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-800 uppercase tracking-wider mb-1">Nombre</label>
                        <input type="text" id="nombre" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-slate-400 focus:bg-white text-2xl transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-800 uppercase tracking-wider mb-1">Apellido</label>
                        <input type="text" id="apellido" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-slate-400 focus:bg-white text-2xl transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-800 uppercase tracking-wider mb-1">Fecha de Nacimiento</label>
                    <input type="date" id="fec_nac" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-slate-400 focus:bg-white text-2xl transition-all">
                </div>
                
                <div class="pt-2">
                    <button onclick="cambiarStyled(); iniciarChat(); " class="w-full bg-slate-800 text-slate-100 p-3 rounded-lg font-medium hover:bg-slate-700 shadow-sm transition-all cursor-pointer tracking-wide text-2xl">
                        Continuar
                    </button>
                </div>
            </div>
        </div>

        <div id="chat-section" class="hidden flex flex-col h-[calc(100vh-64px)] overflow-hidden bg-transparent">
            <div class="flex-1 overflow-y-auto chat-container w-full">
                <div id="chat-box" class="p-4 space-y-4 flex flex-col min-h-full"></div>
            </div>
            <div class="border-t border-slate-400 bg-zinc-300 shadow-md w-full">
                <div id="action-box" class="max-w-4xl mx-auto p-4 flex flex-col gap-3"></div>
            </div>
        </div>
    </main>

    <script>
        let userData = {};
        let currentPriority = "";
        let esPrimeraConsulta = true;


        const main=document.getElementById('main')
        
        function cambiarStyled(){
            main.classList.remove('imagen1');

            main.classList.add('imagen');
        }

        function iniciarChat() {
            userData = {
                dni: document.getElementById('dni').value.trim(),
                nombre: document.getElementById('nombre').value.trim(),
                apellido: document.getElementById('apellido').value.trim(),
                fecha_nacimiento: document.getElementById('fec_nac').value,
                sexo: document.getElementById('sexo').value,
                consulta: ""
            };

            if(!userData.dni || !userData.nombre || !userData.apellido || !userData.fecha_nacimiento) {
                alert("Por favor complete todos los campos.");
                return;
            }

            document.getElementById('form-section').classList.add('hidden');
            document.getElementById('chat-section').classList.remove('hidden');
            document.getElementById('btn-reiniciar').classList.remove('hidden'); 

            appendBubble(`Hola ${userData.nombre}, soy tu asistente virtual.`, 'bot');
            mostrarInputTextoEstandar();
        }

        function reiniciarChat() {
            document.getElementById('chat-box').innerHTML = ""; 
            esPrimeraConsulta = true; 
            currentPriority = "";
            userData.consulta = ""; 
            appendBubble(`Hola ${userData.nombre}, soy tu asistente virtual.`, 'bot');
            mostrarInputTextoEstandar();
        }

        function mostrarInputTextoEstandar() {
            const actionBox = document.getElementById('action-box');
            actionBox.innerHTML = `
                <div class="flex gap-3 w-full">
                    <input type="text" id="input-chat" placeholder="Escriba su consulta médica aquí..." class="flex-1 p-3 border border-slate-200 rounded-xl text-2xl focus:outline-none focus:border-slate-400 bg-slate-50 focus:bg-white transition-all shadow-inner">
                    <button onclick="procesarEnvioTexto()" class="bg-slate-800 text-slate-100 px-6 py-3 rounded-xl text-2xl font-medium cursor-pointer hover:bg-slate-700 shadow-sm transition-all tracking-wide">Enviar</button>
                </div>
            `;
            document.getElementById('input-chat').focus();
            document.getElementById('input-chat').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') procesarEnvioTexto();
            });
        }

        function appendBubble(text, sender) {
            const chatBox = document.getElementById('chat-box');
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            bubble.className = `max-w-[75%] p-3.5 rounded-2xl text-2xl shadow-sm whitespace-pre-line leading-relaxed ${sender === 'user' ? 'bg-slate-700 text-slate-100 rounded-tr-none border border-slate-600' : 'bg-white text-slate-800 border border-slate-200/80 rounded-bl-none'}`;
            
            bubble.innerText = text;
            wrapper.appendChild(bubble);
            chatBox.appendChild(wrapper);
            
            setTimeout(() => {
                const container = document.querySelector('.chat-container');
                container.scrollTop = container.scrollHeight;
            }, 50);
        }

        async function procesarEnvioTexto() {
            const inputChat = document.getElementById('input-chat');
            const texto = inputChat.value.trim();
            if(!texto) return;

            appendBubble(texto, 'user');
            document.getElementById('action-box').innerHTML = ""; 

            if (esPrimeraConsulta) {
                userData.consulta = texto; 
                esPrimeraConsulta = false; 

                const response = await fetch('/api/inicial', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(userData)
                });
                const data = await response.json();
                procesarRespuestaServidor(data);
            }
        }

        function procesarRespuestaServidor(data) {
            appendBubble(data.mensaje || data.text, 'bot');
            const actionBox = document.getElementById('action-box');
            actionBox.innerHTML = ""; 

            if (data.status === "finalizado") {
                return;
            } 
            else if (data.status === "opciones_prioridad") {
                renderBotones(data.opciones, async (opc) => {
                    appendBubble(opc.texto, 'user');
                    const res = await fetch('/api/secretaria/siguiente', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ opcion_id: opc.id, user_data: userData })
                    });
                    const siguienteData = await res.json();
                    procesarRespuestaServidor(siguienteData);
                });
            }
            else if (data.status === "opciones_faq" || data.status === "opciones_areas") {
                currentPriority = data.prioridad;
                const tipoEnvio = data.status === "opciones_faq" ? "faq" : "areas";
                renderBotones(data.opciones, async (opc) => {
                    appendBubble(opc.texto, 'user');
                    const res = await fetch('/api/secretaria/finalizar', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ tipo: tipoEnvio, sub_opcion_id: opc.id, prioridad: currentPriority, user_data: userData })
                    });
                    const finData = await res.json();
                    procesarRespuestaServidor(finData);
                });
            }
            else if (data.status === "opciones_motivo_reclamo") {
                currentPriority = data.prioridad;
                renderBotones(data.opciones, async (opc) => {
                    appendBubble(opc.texto, 'user');
                    const res = await fetch('/api/secretaria/reclamo_texto', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({})
                    });
                    const sigData = await res.json();
                    procesarRespuestaServidor(sigData);
                });
            }
            else if (data.status === "formulario_reclamo") {
                actionBox.innerHTML = `
                    <div class="flex gap-3 w-full">
                        <input type="text" id="input-reclamo" placeholder="Escriba aquí los detalles de su reclamo..." class="flex-1 p-3 border border-slate-200 rounded-xl text-2xl focus:outline-none focus:border-slate-400 bg-slate-50 focus:bg-white transition-all">
                        <button onclick="enviarTextoReclamo()" class="bg-slate-800 text-slate-100 px-6 py-3 rounded-xl text-2xl font-medium cursor-pointer hover:bg-slate-700 shadow-sm transition-all">Enviar</button>
                    </div>
                `;
                document.getElementById('input-reclamo').focus();
            }
        }

        function renderBotones(opciones, callback) {
            const actionBox = document.getElementById('action-box');
            const grid = document.createElement('div');
            grid.className = "grid grid-flow-col auto-cols-fr gap-3 w-full";

            opciones.forEach(opc => {
                const btn = document.createElement('button');
                btn.className = "bg-white hover:bg-slate-100 text-slate-700 hover:text-slate-900 p-3 rounded-xl text-2xl font-medium border border-slate-200 transition-all shadow-sm cursor-pointer text-center";
                btn.innerText = opc.texto;
                btn.onclick = () => {
                    actionBox.innerHTML = "";
                    callback(opc);
                };
                grid.appendChild(btn);
            });
            actionBox.appendChild(grid);
        }

        async function enviarTextoReclamo() {
            const texto = document.getElementById('input-reclamo').value.trim();
            if(!texto) return;
            
            appendBubble(texto, 'user');
            document.getElementById('action-box').innerHTML = "";

            const res = await fetch('/api/secretaria/finalizar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ tipo: 'reclamo', texto_reclamo: texto, prioridad: currentPriority, user_data: userData })
            });
            const finData = await res.json();
            procesarRespuestaServidor(finData);
        }
    </script>
</body>
</html>
